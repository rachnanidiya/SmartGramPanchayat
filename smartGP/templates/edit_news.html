<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit News</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fef9f3;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            background-color: #fff;
            margin: 50px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        form label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #444;
        }

        form input[type="text"],
        form input[type="date"],
        form input[type="file"],
        form textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            resize: vertical;
        }

        form textarea {
            min-height: 120px;
        }

        .btn-submit {
            background-color: #2e8b57;
            color: #fff;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            margin-top: 25px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }

        .btn-submit:hover {
            background-color: #257048;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #0077cc;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .preview-image {
            display: block;
            margin-top: 10px;
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Edit News Article</h2>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <label for="title">Title</label>
            <input type="text" name="title" id="title" value="{{ news.title }}" required>

            <label for="content">Content</label>
            <textarea name="content" id="content" required>{{ news.content }}</textarea>

            <label for="date">Date</label>
            <input type="date" name="date" id="date" value="{{ news.date|date:'Y-m-d' }}" required>

            <label for="image">Update Image</label>
            <input type="file" name="image" id="image">
            
            {% if news.image %}
                <img src="{{ news.image.url }}" alt="Current Image" class="preview-image">
            {% else %}
                <p style="color: gray;">No image uploaded yet.</p>
            {% endif %}

            <button type="submit" class="btn-submit">Save Changes</button>
        </form>
        <a href="{% url 'admin_dashboard' %}" class="back-link">← Back to Dashboard</a>
    </div>
</body>
</html>
